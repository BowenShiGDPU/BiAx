[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "biax"
version = "1.0.0"
description = "Shared bi-axis neural architecture for interaction and adverse-reaction prediction"
requires-python = ">=3.12"
dependencies = [
  "numpy>=2.0,<3",
  "pandas>=2.2,<3",
  "pyarrow>=17,<25",
  "scikit-learn>=1.5,<2",
  "scipy>=1.14,<2",
  "torch>=2.9,<3",
]

[project.optional-dependencies]
test = ["pytest>=8,<9"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
